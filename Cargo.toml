[package]
name = "termed"
version = "0.1.0"
edition = "2024"
default-run = "termed"

[lib]
name = "termed"
path = "src/lib.rs"

[[bin]]
name = "termed"
path = "src/main.rs"

[[bin]]
name = "head"
path = "src/bin/head.rs"

[[bin]]
name = "tail"
path = "src/bin/tail.rs"

[[bin]]
name = "grep"
path = "src/bin/grep.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
ignore = "0.4"
image = { version = "0.25", default-features = true }
memchr = "2.7"
nucleo-matcher = "0.3"
ratatui = { version = "0.29", features = ["all-widgets"] }
regex = "1.11"
ropey = "1.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
similar = "2.6"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
unicode-segmentation = "1.12"
unicode-width = "0.2"
ureq = { version = "3.0", features = ["json", "rustls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
