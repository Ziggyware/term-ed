[package]
name = "termed"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
base64 = "0.22"
clap = { version = "4.6.7", features = ["derive", "env"] }
ignore = "0.4.33"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
nucleo-matcher = "0.3.1"
ratatui = "0.30.2"
ratatui-image = { version = "11.1", default-features = false, features = ["crossterm"] }
regex = "1.13.1"
ropey = "1.6.1"
serde_json = "1.0.152"
similar = "2"
syntect = "5.3.0"
two-face = "0.5.2"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"
ureq = "3.4.2"

[dev-dependencies]
unicode-width = "0.2"
